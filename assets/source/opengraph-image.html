<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Aurevia Gaming link preview</title>
  <!-- Source for public/og/aurevia-gaming-{en,es,pt}.jpg. ?lang=es|pt selects the copy,
       which matches the homepage hero in src/content/site-content.ts and translations.ts. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&family=Sora:wght@700&display=block" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      display: grid; grid-template-columns: minmax(0, 1fr) 500px; gap: 52px; align-items: center;
      padding: 60px 64px 60px 72px; color: #f7f7f4; font-family: Manrope, sans-serif;
      background:
        radial-gradient(circle at 90% -10%, rgb(212 175 55 / .2), transparent 520px),
        radial-gradient(circle at -5% 105%, rgb(212 175 55 / .1), transparent 420px),
        #07090c;
      -webkit-font-smoothing: antialiased;
    }
    .brand { display: flex; align-items: center; gap: 14px; color: #d4af37; font: 700 21px/1 Sora, sans-serif; letter-spacing: .02em; text-transform: uppercase; }
    .brand svg { width: 50px; height: 47px; flex: none; }
    .eyebrow { display: inline-flex; margin-top: 40px; padding: 10px 20px; border: 1px solid rgb(212 175 55 / .4); border-radius: 999px; background: rgb(255 255 255 / .04); color: #d4af37; font: 800 15px/1 Manrope, sans-serif; letter-spacing: .06em; text-transform: uppercase; }
    h1 { margin-top: 24px; font: 700 64px/1.04 Sora, sans-serif; letter-spacing: -.035em; }
    h1 span { display: block; color: #d4af37; }
    ul { display: flex; flex-wrap: wrap; gap: 10px 26px; margin-top: 36px; padding: 0; list-style: none; color: #d4af37; font: 800 14px/1.2 Manrope, sans-serif; letter-spacing: .05em; text-transform: uppercase; }
    figure { overflow: hidden; border: 1px solid rgb(212 175 55 / .45); border-radius: 22px; background: #11161f; box-shadow: 0 30px 80px rgb(0 0 0 / .55); }
    figure img { display: block; width: 100%; height: auto; }
    figcaption { padding: 14px 18px; color: #a6abb6; font: 600 14px/1.3 Manrope, sans-serif; }
  </style>
</head>
<body>
  <main>
    <p class="brand">
      <svg viewBox="50 8 330 308" aria-hidden="true"><path fill="currentColor" d="M223 20 108 261c-10 18-26 33-45 39 19 6 39 4 58-2 21-7 43-22 66-42 15 25 38 44 65 47 26 2 72 1 114 1l-37-74h-65l13 24h29l12 25h-58c-19 0-36-15-46-36 31-22 65-38 97-41 15-1 29 0 40 2-19-11-38-19-52-21-23-4-43 1-69 9-33 11-65 36-85 56-8 7-16 12-24 13 16-10 30-26 41-45 14-25 40-77 61-122l37 73 37 2-9-18L223 20Z"/></svg>
      Aurevia Gaming
    </p>
    <p class="eyebrow" data-copy="eyebrow">Casino-tech studio</p>
    <h1><span data-copy="title" style="color:inherit">Casino games</span><span data-copy="highlight">connected.</span></h1>
    <ul data-copy="details"></ul>
  </main>
  <figure>
    <img src="../../public/media/games/wildframes-gameplay.webp" alt="">
    <figcaption data-copy="caption">Play’n GO · Wild Frames sandbox capture</figcaption>
  </figure>
  <script>
    const copy = {
      en: { eyebrow: "Casino-tech studio", title: "Casino games", highlight: "connected.", details: ["9 prepared games", "Wallet API", "Admin analytics"], caption: "Play’n GO · Wild Frames sandbox capture" },
      es: { eyebrow: "Estudio de tecnología para casinos", title: "Juegos de casino", highlight: "conectados.", details: ["9 juegos disponibles", "API de monedero", "Análisis administrativo"], caption: "Play’n GO · Captura de Wild Frames en sandbox" },
      pt: { eyebrow: "Estúdio de tecnologia para cassinos", title: "Jogos de cassino", highlight: "conectados.", details: ["9 jogos disponíveis", "API de carteira", "Análise administrativa"], caption: "Play’n GO · Captura do Wild Frames em sandbox" },
    };
    const lang = new URLSearchParams(location.search).get("lang");
    const text = copy[lang] ?? copy.en;
    document.documentElement.lang = copy[lang] ? lang : "en";
    for (const element of document.querySelectorAll("[data-copy]")) {
      const value = text[element.dataset.copy];
      if (Array.isArray(value)) element.replaceChildren(...value.map((item) => Object.assign(document.createElement("li"), { textContent: item })));
      else element.textContent = value;
    }
  </script>
</body>
</html>
