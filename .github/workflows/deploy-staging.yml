name: Deploy staging

# Staging deploys only from dev; manual dispatch redeploys dev. The staging
# environment's dev-only deployment branch policy enforces this server-side.
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a running deployment: an interrupted VPS helper can stop after
# switching releases but before its health check and rollback.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

# Public build settings. The build job has no environment, so it cannot read the
# staging environment's variables; these values are compiled into the site and
# visible to every visitor. Change them here, never in the environment.
env:
  APP_ENV: staging
  SITE_URL: https://staging.aureviagaming.com
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAAEPEEG3a3I-GS9qC
  NEXT_PUBLIC_DEMO_RUNTIME_ORIGIN: ""
  NEXT_PUBLIC_GA_ID: ""

jobs:
  # Dependency install scripts run only in this job, which has no environment
  # and no secrets, so they can never reach the deploy key or the deploy job.
  build:
    name: Build staging
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build staging release
        run: npm run build

      - name: Package standalone release
        id: package
        shell: bash
        run: |
          archive="$RUNNER_TEMP/release/aurevia-gaming-$GITHUB_SHA.tar.gz"
          npm run release:package -- "$archive"
          npm run release:verify -- "$archive"
          echo "sha256=$(awk 'NR == 1 { print $1 }' "$archive.sha256")" >> "$GITHUB_OUTPUT"

      - name: Upload release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            ${{ runner.temp }}/release/aurevia-gaming-${{ github.sha }}.tar.gz
            ${{ runner.temp }}/release/aurevia-gaming-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
          # The archive is already gzip-compressed.
          compression-level: 0

  # Holds the staging secrets. It checks out only the scripts it runs and never
  # installs or runs npm packages.
  deploy:
    # The master ruleset requires a successful check with this name.
    name: Deploy staging
    if: github.ref == 'refs/heads/dev'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: https://staging.aureviagaming.com

    steps:
      - name: Check out deployment scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/deploy-vps.sh
            scripts/verify-public-health.sh

      - name: Check the environment's build variables
        # A staging variable that disagrees with the build settings above would
        # otherwise be ignored silently, for example a rotated Turnstile key.
        shell: bash
        env:
          CONFIGURED_SITE_URL: ${{ vars.SITE_URL }}
          CONFIGURED_NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          CONFIGURED_NEXT_PUBLIC_DEMO_RUNTIME_ORIGIN: ${{ vars.NEXT_PUBLIC_DEMO_RUNTIME_ORIGIN }}
          CONFIGURED_NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
        run: |
          status=0
          for name in SITE_URL NEXT_PUBLIC_TURNSTILE_SITE_KEY NEXT_PUBLIC_DEMO_RUNTIME_ORIGIN NEXT_PUBLIC_GA_ID; do
            configured="CONFIGURED_$name"
            if [[ -n "${!configured}" && "${!configured}" != "${!name}" ]]; then
              echo "::error::The staging environment variable $name differs from the build setting in .github/workflows/deploy-staging.yml, which the build uses. Change the setting there, then delete the variable." >&2
              status=1
            fi
          done
          exit "$status"

      - name: Download release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release

      - name: Verify release checksum
        shell: bash
        env:
          RELEASE_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          cd "$RUNNER_TEMP/release"
          checksum="aurevia-gaming-$GITHUB_SHA.tar.gz.sha256"
          if [[ "$(awk 'NR == 1 { print $1 }' "$checksum")" != "$RELEASE_SHA256" ]]; then
            echo "::error::The downloaded checksum differs from the one the build job recorded." >&2
            exit 1
          fi
          sha256sum --check --strict "$checksum"

      - name: Deploy and verify on staging VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: bash scripts/deploy-vps.sh staging "$RUNNER_TEMP/release/aurevia-gaming-$GITHUB_SHA.tar.gz" "$GITHUB_SHA"

      - name: Verify staging through Cloudflare
        shell: bash
        run: bash scripts/verify-public-health.sh https://staging.aureviagaming.com staging "$GITHUB_SHA"

  promote:
    name: Prepare production promotion
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      statuses: write

    steps:
      - name: Create or update dev to master pull request
        id: promotion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repository="$GITHUB_REPOSITORY"
          body="Staging deployed \`$GITHUB_SHA\` successfully ([workflow run]($GITHUB_SERVER_URL/$repository/actions/runs/$GITHUB_RUN_ID)).

          Review and approve this PR, then merge it with **Create a merge commit**. Do not squash or rebase: production deploys only a master merge commit whose dev parent passed staging. Auto-merge is disabled for this repository."
          pull_number="$(gh pr list \
            --repo "$repository" \
            --base master \
            --head dev \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -z "$pull_number" ]]; then
            # Re-running a deployment after its promotion: master already has
            # every dev commit, and GitHub refuses a pull request without any.
            if [[ "$(gh api "repos/$repository/compare/master...dev" --jq '.ahead_by')" == "0" ]]; then
              echo "master already contains dev; there is nothing to promote."
              echo "pull_number=" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            pull_url="$(gh pr create \
              --repo "$repository" \
              --base master \
              --head dev \
              --title "chore: promote dev to production" \
              --body "$body")"
            pull_number="${pull_url##*/}"
          else
            gh pr edit "$pull_number" --repo "$repository" --body "$body" >/dev/null
          fi

          details="$(gh pr view "$pull_number" \
            --repo "$repository" \
            --json baseRefName,headRefName,isCrossRepository \
            --jq '[.baseRefName, .headRefName, .isCrossRepository] | @tsv')"
          IFS=$'\t' read -r base_ref head_ref cross_repository <<< "$details"

          if [[ "$base_ref" != "master" || "$head_ref" != "dev" || "$cross_repository" != "false" ]]; then
            echo "Promotion PR must be same-repository dev -> master." >&2
            exit 1
          fi

          gh api \
            --method POST \
            "repos/$repository/statuses/$GITHUB_SHA" \
            -f state=success \
            -f context='policy/dev-to-master' \
            -f description='Commit deployed successfully from dev to staging' \
            -f target_url="$GITHUB_SERVER_URL/$repository/actions/runs/$GITHUB_RUN_ID" \
            >/dev/null

          echo "pull_number=$pull_number" >> "$GITHUB_OUTPUT"

      - name: Write promotion summary
        env:
          PULL_NUMBER: ${{ steps.promotion.outputs.pull_number }}
        run: |
          if [[ -z "$PULL_NUMBER" ]]; then
            echo "master already contains dev; there is nothing to promote." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Production promotion PR: #$PULL_NUMBER" >> "$GITHUB_STEP_SUMMARY"
          echo "Review, approve and merge the promotion PR with a merge commit to deploy production." >> "$GITHUB_STEP_SUMMARY"
