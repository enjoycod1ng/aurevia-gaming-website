name: Deploy production

# Production deploys only from master. The job guard and promotion check below
# are defense in depth; the enforcing controls are the production environment's
# master-only deployment branch policy, its required reviewer and the master
# ruleset (ops/configure-github-protection.sh, ops/AUTO-DEPLOY.md).
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      statuses: read
    environment:
      name: production
      url: https://aureviagaming.com
    env:
      APP_ENV: production
      SITE_URL: ${{ vars.SITE_URL }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      NEXT_PUBLIC_DEMO_RUNTIME_ORIGIN: ${{ vars.NEXT_PUBLIC_DEMO_RUNTIME_ORIGIN }}
      NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The promotion check compares the merge commit with its dev parent.
          fetch-depth: 2

      - name: Verify the commit passed staging from dev
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/verify-promotion.sh "$GITHUB_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build production release
        run: npm run build

      - name: Package standalone release
        id: package
        shell: bash
        run: |
          archive="$RUNNER_TEMP/aurevia-gaming-$GITHUB_SHA.tar.gz"
          npm run release:package -- "$archive"
          npm run release:verify -- "$archive"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Deploy and verify on production VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_DEPLOY_PROTOCOL: ${{ vars.VPS_DEPLOY_PROTOCOL }}
        run: bash scripts/deploy-vps.sh production "${{ steps.package.outputs.archive }}" "$GITHUB_SHA"

      - name: Verify production through Cloudflare
        shell: bash
        run: bash scripts/verify-public-health.sh https://aureviagaming.com production "$GITHUB_SHA"
