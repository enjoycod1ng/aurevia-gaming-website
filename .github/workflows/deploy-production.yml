name: Deploy production

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://aureviagaming.com
    env:
      APP_ENV: production
      SITE_URL: https://aureviagaming.com
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build production release
        run: npm run build

      - name: Package standalone release
        id: package
        shell: bash
        run: |
          archive="$RUNNER_TEMP/aurevia-gaming-$GITHUB_SHA.tar.gz"
          npm run release:package -- "$archive"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Deploy to production VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: bash scripts/deploy-vps.sh production "${{ steps.package.outputs.archive }}" "$GITHUB_SHA"

      - name: Verify production through Cloudflare
        shell: bash
        run: |
          response="$(curl --fail --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 2 \
            https://aureviagaming.com/api/health)"
          node -e '
            const health = JSON.parse(process.argv[1]);
            if (health.status !== "ok" || health.environment !== "production" || health.revision !== process.env.GITHUB_SHA) {
              throw new Error(`Unexpected production health response: ${JSON.stringify(health)}`);
            }
          ' "$response"
