<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="avh2-title avh2-desc">
  <title id="avh2-title">Aurevia Gaming horizontal metallic-gold logo</title>
  <desc id="avh2-desc">A horizontal Aurevia Gaming logo with a three-dimensional golden A crossed by a luminous path.</desc>

  <defs>
    <linearGradient id="avh2-goldBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8C8"/>
      <stop offset="0.15" stop-color="#FFD95A"/>
      <stop offset="0.34" stop-color="#F6B80F"/>
      <stop offset="0.52" stop-color="#FFF0A0"/>
      <stop offset="0.70" stop-color="#D88A00"/>
      <stop offset="0.86" stop-color="#FFD65B"/>
      <stop offset="1" stop-color="#7D4100"/>
    </linearGradient>
    <linearGradient id="avh2-goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDE8"/>
      <stop offset="0.12" stop-color="#FFE37A"/>
      <stop offset="0.30" stop-color="#F2A900"/>
      <stop offset="0.46" stop-color="#FFF3A6"/>
      <stop offset="0.62" stop-color="#C76C00"/>
      <stop offset="0.78" stop-color="#FFD85F"/>
      <stop offset="1" stop-color="#783700"/>
    </linearGradient>
    <linearGradient id="avh2-goldEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFBE0"/>
      <stop offset="0.35" stop-color="#FFD65B"/>
      <stop offset="0.68" stop-color="#D38300"/>
      <stop offset="1" stop-color="#713500"/>
    </linearGradient>
    <linearGradient id="avh2-ribbonGold" x1="0" y1="0" x2="1" y2="0.9">
      <stop offset="0" stop-color="#FFF9D0"/>
      <stop offset="0.20" stop-color="#FFE06A"/>
      <stop offset="0.45" stop-color="#F2A500"/>
      <stop offset="0.67" stop-color="#FFF1A6"/>
      <stop offset="0.85" stop-color="#D68000"/>
      <stop offset="1" stop-color="#743500"/>
    </linearGradient>
    <linearGradient id="avh2-ribbonShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8C4700"/>
      <stop offset="1" stop-color="#351200"/>
    </linearGradient>
    <radialGradient id="avh2-glint" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="0.38" stop-color="#FFF5A8" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#FFD23C" stop-opacity="0"/>
    </radialGradient>
    <filter id="avh2-shadow" x="-35%" y="-35%" width="175%" height="185%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="shadowBlur"/>
      <feOffset in="shadowBlur" dx="0" dy="8" result="shadowOffset"/>
      <feFlood flood-color="#000000" flood-opacity="0.56" result="shadowColor"/>
      <feComposite in="shadowColor" in2="shadowOffset" operator="in" result="shadowLayer"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.6" result="glowBlur"/>
      <feFlood flood-color="#FFB516" flood-opacity="0.24" result="glowColor"/>
      <feComposite in="glowColor" in2="glowBlur" operator="in" result="glowLayer"/>
      <feMerge><feMergeNode in="shadowLayer"/><feMergeNode in="glowLayer"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="avh2-softGlow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="avh2-aClip">
      <path fill-rule="evenodd" d="M128 18 238 224h-50l-24-47H92l-24 47H18L128 18Zm0 63-25 58h50l-25-58Z"/>
    </clipPath>
  </defs>

