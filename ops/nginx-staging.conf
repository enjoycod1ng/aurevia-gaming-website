server {
    listen 80;
    listen [::]:80;
    server_name staging.aureviagaming.com;

    return 301 https://staging.aureviagaming.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staging.aureviagaming.com;

    ssl_certificate /etc/ssl/cloudflare/aurevia-staging.pem;
    ssl_certificate_key /etc/ssl/cloudflare/aurevia-staging.key;

    client_max_body_size 64k;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
