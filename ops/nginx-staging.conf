server {
    listen 80;
    listen [::]:80;
    server_name staging.aureviagaming.com;

    return 301 https://staging.aureviagaming.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging.aureviagaming.com;

    ssl_certificate /etc/letsencrypt/live/staging.aureviagaming.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.aureviagaming.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 64k;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
