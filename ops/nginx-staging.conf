# Requires /etc/nginx/conf.d/aurevia-cloudflare.conf (ops/update-cloudflare-ips.sh)
# and /etc/nginx/snippets/aurevia-proxy-headers.conf (ops/nginx-proxy-headers.conf).
server {
    listen 80;
    listen [::]:80;
    server_name staging.aureviagaming.com;

    # Certificate renewals may arrive directly; everything else must come through Cloudflare.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        if ($aurevia_from_cloudflare = 0) {
            return 444;
        }
        return 301 https://staging.aureviagaming.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging.aureviagaming.com;

    ssl_certificate /etc/letsencrypt/live/staging.aureviagaming.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.aureviagaming.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Direct hits on the origin would skip the WAF, bot protection and rate limits.
    if ($aurevia_from_cloudflare = 0) {
        return 444;
    }

    client_max_body_size 64k;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/aurevia-proxy-headers.conf;
    }
}
