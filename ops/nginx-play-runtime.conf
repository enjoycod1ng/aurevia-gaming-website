# Serves only the Play'n GO demo runtime on its own origin, so runtime scripts
# never share an origin with the staff portal (ops/ORIGIN-HARDENING.md, step 6).
# Installed on the VPS as /etc/nginx/sites-available/aurevia-play; the
# Cloudflare-only check and the shared proxy headers were added on 2026-10-16.
#
# Requires /etc/nginx/conf.d/aurevia-cloudflare.conf (ops/update-cloudflare-ips.sh)
# and /etc/nginx/snippets/aurevia-proxy-headers.conf (ops/nginx-proxy-headers.conf),
# like ops/nginx-staging.conf.
server {
    listen 80;
    listen [::]:80;
    server_name play.aureviagaming.com;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        if ($aurevia_from_cloudflare = 0) {
            return 444;
        }
        return 301 https://play.aureviagaming.com$request_uri;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name play.aureviagaming.com;
    ssl_certificate /etc/letsencrypt/live/play.aureviagaming.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/play.aureviagaming.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Direct hits on the origin would skip the WAF, bot protection and rate limits.
    if ($aurevia_from_cloudflare = 0) {
        return 444;
    }

    client_max_body_size 64k;

    # The game runtime only. The website's portal API, the backend's portal routes
    # and every other path stay unreachable on this host.
    location /playngo-sandbox/runtime/ {
        proxy_pass http://127.0.0.1:18080;
        include /etc/nginx/snippets/aurevia-proxy-headers.conf;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Only the production and staging websites may frame the runtime. add_header
        # here replaces any server-level add_header, so every header is listed here.
        add_header Content-Security-Policy "frame-ancestors https://aureviagaming.com https://staging.aureviagaming.com" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location / {
        return 404;
    }
}
