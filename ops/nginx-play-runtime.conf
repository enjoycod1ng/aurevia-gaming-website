# Serves only the Play'n GO demo runtime on its own origin, so runtime scripts
# never share an origin with the staff portal (ops/ORIGIN-HARDENING.md, step 6).
# Installed on the VPS as /etc/nginx/sites-available/aurevia-play (2026-10-16).
#
# The proxy headers match the backend's nginx-aurevia-playngo.snippet, which the
# main site uses for the same runtime today. Once ORIGIN-HARDENING.md steps 1-3
# are installed, add the Cloudflare-only check and replace these headers with
# /etc/nginx/snippets/aurevia-proxy-headers.conf, as ops/nginx-staging.conf does.
server {
    listen 80;
    listen [::]:80;
    server_name play.aureviagaming.com;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://play.aureviagaming.com$request_uri;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name play.aureviagaming.com;
    ssl_certificate /etc/letsencrypt/live/play.aureviagaming.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/play.aureviagaming.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 64k;

    # The game runtime only. The website's portal API, the backend's portal routes
    # and every other path stay unreachable on this host.
    location /playngo-sandbox/runtime/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Only the production and staging websites may frame the runtime. add_header
        # here replaces any server-level add_header, so every header is listed here.
        add_header Content-Security-Policy "frame-ancestors https://aureviagaming.com https://staging.aureviagaming.com" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location / {
        return 404;
    }
}
