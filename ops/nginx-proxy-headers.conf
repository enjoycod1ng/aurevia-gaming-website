# Include inside every location that proxies to Next.js (staging and production):
#
#   sudo install -m 0644 ops/nginx-proxy-headers.conf /etc/nginx/snippets/aurevia-proxy-headers.conf
#   include /etc/nginx/snippets/aurevia-proxy-headers.conf;
#
# $remote_addr is the visitor only after aurevia-cloudflare.conf validated the
# Cloudflare peer. Every client-supplied address header is overwritten so the
# app (src/lib/client-ip.ts) can trust X-Real-IP.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header CF-Connecting-IP "";
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
